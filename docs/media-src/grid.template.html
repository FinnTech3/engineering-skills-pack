<!doctype html><meta charset="utf-8"><title>Skills grid</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:1100px;background:#0d0f1f;color:#e8eaff;font-family:Inter,system-ui,sans-serif}
.page{padding:44px 44px 30px}
h1{margin:0 0 8px;font-size:34px;line-height:1.15;letter-spacing:-.01em;color:#fff}
.sub{margin:0 0 30px;font-size:18px;color:#aab0dd}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#171a33;border:1px solid #2a2e55;border-left:5px solid var(--c);border-radius:14px;
  padding:16px 18px 16px;min-height:150px}
.chip{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700}
.name{margin:6px 0 10px;font:700 19px/1.2 'DejaVu Sans Mono','JetBrains Mono',Menlo,monospace;color:#fff;
  overflow-wrap:anywhere}
ul{margin:0;padding:0;list-style:none}
li{font-size:15px;line-height:1.45;color:#c9cef3}
.tool{background:transparent;border:1px dashed #6d6aa8}
.ok{margin-top:4px;color:#4ade80;font:600 13.5px 'DejaVu Sans Mono',monospace}
.foot{margin-top:22px;font-size:13.5px;color:#7f86b8}
</style>
<div class="page">
<h1>Say the job. The agent loads the matching skill.</h1>
<p class="sub">{{COUNT}} skills. Each has numbered steps, exit criteria a command can check, and a list of when to stop and ask.</p>
<div class="grid">
{{CARDS}}
</div>
<p class="foot">Trigger phrases are quoted from each skill's SKILL.md frontmatter. Generated by docs/media-src/grid.py.</p>
</div>
