name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate skills
        run: skillcheck validate skills
      - name: Check INDEX.md is current
        run: skillcheck index --check
      - name: Check the Agensi package
        run: python tools/agensi_build.py agensi/engineering-workflow-skills --with skills
